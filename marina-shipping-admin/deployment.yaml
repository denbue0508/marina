apiVersion: apps/v1
kind: Deployment
metadata:
  name: marina-shipping-admin-deployment
  labels:
    app: marina-admin
  namespace: marina-shipping
spec:
  replicas: 3
  selector:
    matchLabels:
      app: marina-shipping-admin
  template:
    metadata:
      labels:
        app: marina-shipping-admin
    spec:
      imagePullSecrets:
        - name: nexus-creds
      containers:
      - name: marina-shipping-admin
        image: nexus3.cloudit.ph:7777/marina-admin  # Recommended to use a specific version over 'latest'
        ports:
        - containerPort: 30001
        resources:
          limits:
            cpu: "500m"
            memory: "256Mi"
          requests:
            cpu: "250m"
            memory: "128Mi"
