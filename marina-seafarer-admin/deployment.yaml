apiVersion: apps/v1
kind: Deployment
metadata:
  name: marina-seafarer-admin-deployment
  labels:
    app: marina-seafarer-admin
  namespace: marina-seafarer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: marina-seafarer-admin
  template:
    metadata:
      labels:
        app: marina-seafarer-admin
    spec:
      containers:
      - name: marina-seafarer-admin
        image: nginx:1.25.0
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
