apiVersion: apps/v1
kind: Deployment
metadata:
  name: marina-seafarer-frontend-deployment
  labels:
    app: marina-seafarer-frontend
  namespace: marina-seafarer
spec:
  replicas: 3
  selector:
    matchLabels:
      app: marina-seafarer-frontend
  template:
    metadata:
      labels:
        app: marina-seafarer-frontend
    spec:
      containers:
      - name: marina-seafarer-frontend
        image: nginx:1.25.0
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
