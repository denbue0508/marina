apiVersion: apps/v1
kind: Deployment
metadata:
  name: marina-indexer-seafarer-deployment
  labels:
    app: marina-indexer-seafarer
spec:
  replicas: 3
  selector:
    matchLabels:
      app: marina-indexer-seafarer
  template:
    metadata:
      labels:
        app: marina-indexer-seafarer
    spec:
      containers:
      - name: marina-indexer-seafarer
        image: nginx:1.25.0
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
