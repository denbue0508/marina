apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: marina-seafarer-backend-ingress
  namespace: marina-seafarer
  annotations:
    # Optional: common NGINX annotations (e.g., path rewriting)
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx  # Specifies the Ingress Controller handling this resource
  rules:
  - host: marina-seafarer-backend.cloudit.ph
    http:
      paths:
      - path: /
        pathType: Prefix   # Can be Prefix, Exact, or ImplementationSpecific
        backend:
          service:
            name: marina-seafarer-backend-service
            port:
              number: 80
