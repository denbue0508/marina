apiVersion: apps/v1
kind: Deployment
metadata:
  name: marina-shipping-backend-deployment
  labels:
    app: marina-shipping-backend
  namespace: marina-shipping
spec:
  replicas: 2
  selector:
    matchLabels:
      app: marina-shipping-backend
  template:
    metadata:
      labels:
        app: marina-shipping-backend
    spec:
      imagePullSecrets:
        - name: nexus-creds
      containers:
      - name: marina-shipping-backend
        image: nginx:1.25.0  # Recommended to use a specific version over 'latest'
        ports:
        - containerPort: 30001
        resources:
          limits:
            cpu: "500m"
            memory: "256Mi"
          requests:
            cpu: "250m"
            memory: "128Mi"
